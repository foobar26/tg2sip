sip:
  transport: udp
  local_port: 5062            # 5060 belongs to Asterisk on the host
  rtp_port_range: [4000, 4100]
  codec_priorities:
    PCMA/8000: 200
    PCMU/8000: 180
    opus/48000: 0

telegram:
  session_name: gateway
  call_protocol:
    min_layer: 92
    max_layer: 92
    udp_p2p: true
    udp_reflector: true
    library_versions: ["3.0.0"]
  # TG→SIP routing + whitelist. When one of these Telegram accounts CALLS the
  # gateway, it dials the mapped SIP destination; callers not listed are declined.
  # Keys: numeric TG user id (quote it) or "@username" — a caller's phone number
  # is NOT visible to us, so no phone keys. Values: a SIP extension
  # (→ sip:<ext>@SIP_DOMAIN) or a full sip: URI. A configured VIDEO_SOURCE_URL
  # (e.g. a doorbell camera) is also shown one-way to the caller.
  inbound_routes: {}
  #  "123456789": "12"           # TG user 123456789 → SIP extension 12
  #  "@somebody":  "200"         # TG @somebody      → extension 200
  #  "123456789": "sip:door@10.0.0.5"   # full URI

bridge:
  sip_sample_rate: 8000
  tg_sample_rate: 48000
  frame_ms: 20
  jitter_ms: 60

behaviour:
  reject_if_busy: true
  hangup_on_tg_decline: true
  caller_id_in_tg_message: true

# Optional outgoing video. When VIDEO_SOURCE_URL is set in .env, inbound calls
# become Telegram *video* calls showing that stream (e.g. an MJPEG camera).
# Audio is still bridged from the SIP caller. These set the encode resolution.
video:
  width: 640
  height: 480
  fps: 15
