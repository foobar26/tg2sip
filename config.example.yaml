sip:
  transport: udp
  local_port: 5062            # 5060 belongs to Asterisk on the host
  rtp_port_range: [4000, 4100]
  codec_priorities:
    PCMA/8000: 200
    PCMU/8000: 180
    opus/48000: 0

telegram:
  session_name: gateway
  call_protocol:
    min_layer: 92
    max_layer: 92
    udp_p2p: true
    udp_reflector: true
    # Versions ntgcalls itself implements. 8/9 are required for older clients
    # (Telegram Android etc); 12/13 are required for Telegram WebK — without
    # them WebK calls fail with CALL_PROTOCOL_COMPAT_LAYER_INVALID. The
    # negotiated version is picked from the intersection with the peer's offer.
    library_versions: ["8.0.0", "9.0.0", "12.0.0", "13.0.0"]
  # TG→SIP routing + whitelist. When one of these Telegram accounts CALLS the
  # gateway, it dials the mapped SIP destination; callers not listed are declined.
  # Keys: numeric TG user id, "@username", or "+<phone>" (E.164). A phone key is
  # resolved to its user id at match time and imported as a contact (we can't see
  # a caller's number, so we resolve the configured one instead) — the number
  # must be a Telegram user. Values: a SIP extension (→ sip:<ext>@SIP_DOMAIN) or
  # a full sip: URI. A configured VIDEO_SOURCE_URL (e.g. a doorbell camera) is
  # also shown one-way to the caller.
  inbound_routes: {}
  #  "123456789":      "12"      # TG user id  → SIP extension 12
  #  "+4915112345678": "12"      # TG phone    → SIP extension 12
  #  "@somebody":      "200"     # TG username → extension 200
  #  "234567890": "sip:door@10.0.0.5"   # full URI

bridge:
  sip_sample_rate: 8000
  tg_sample_rate: 48000
  frame_ms: 20
  jitter_ms: 60

behaviour:
  reject_if_busy: true
  hangup_on_tg_decline: true
  caller_id_in_tg_message: true

# Optional outgoing video. When VIDEO_SOURCE_URL is set in .env, inbound calls
# become Telegram *video* calls showing that stream (e.g. an MJPEG camera).
# Audio is still bridged from the SIP caller. These set the encode resolution.
video:
  width: 640
  height: 480
  fps: 15
