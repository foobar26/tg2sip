services:
  gateway:
    build:
      context: .
      args:
        # 1 = build ntgcalls without the openh264 encoder (video uses VP8);
        # 0 = stock wheel (H264). Rebuild after changing: docker compose up -d --build
        NTGCALLS_STRIP_H264: ${NTGCALLS_STRIP_H264:-0}
    container_name: tg2sip
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ./sessions:/app/sessions
      - ./config:/app/config:ro
      - /var/log/tg2sip:/var/log/tg2sip
      # Make log timestamps use the host's local timezone (containers default to
      # UTC). Read-only; follows the host zone incl. DST. No tzdata needed.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONFIG_PATH: /app/config/config.yaml
      SESSION_DIR: /app/sessions
      LOG_FILE: /var/log/tg2sip/gateway.log
